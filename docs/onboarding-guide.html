<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>키지기 시작 가이드</title>
</head>
<body>
<style>
  /* 웹폰트를 받지 않는다 - "키가 이 기기를 떠나지 않는다"고 말하는 도구의 문서가
     방문자 IP 를 폰트 CDN 에 넘기면 안 된다. 랜딩(docs/index.html)도 같은 이유로
     시스템 폰트만 쓴다. 요청 0건. */

  /* ── KeyLens 실제 디자인 토큰 그대로 (frontend/src/index.css @theme 이식) ── */
  :root {
    --color-bg: #0b0d10;
    --color-sidebar: #0e1114;
    --color-surface: #12151a;
    --color-surface-2: #0f1216;
    --color-panel: #101318;
    --color-panel-head: #13161b;
    --color-elevated: #15191f;
    --color-chip: #171b21;

    --color-line: #1b2027;
    --color-border: #232931;
    --color-border-strong: #2a313b;

    --color-fg: #e7eaee;
    --color-fg-soft: #c7cdd6;
    --color-muted: #98a1ae;
    --color-faint: #727c89;
    --color-dim: #5c6572;
    --color-dim-3: #49515c;

    --color-mint: #3ecf8e;
    --color-mint-soft: #5fd9a4;
    --color-mint-pale: #a7e8c9;
    --color-on-mint: #05231a;

    --color-amber: #e3b341;
    --color-danger: #e5675c;
    --color-blue: #4e8df5;

    --font-sans: Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', system-ui, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, 'JetBrains Mono', 'D2Coding', Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--color-bg);
    color: var(--color-fg);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(62,207,142,0.28); }
  :focus-visible { outline: 2px solid var(--color-mint); outline-offset: 2px; }
  code {
    font-family: var(--font-mono); font-size: 0.85em;
    background: var(--color-chip); border: 1px solid var(--color-border);
    border-radius: 4px; padding: 0.05em 0.4em; color: var(--color-fg-soft);
  }

  .page { max-width: 720px; margin: 0 auto; padding: 40px 24px 100px; }

  .head { margin-bottom: 32px; }
  .eyebrow {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--color-mint); font-weight: 600;
  }
  h1 {
    font-size: 26px; font-weight: 700; margin: 8px 0 6px; letter-spacing: -0.01em; text-wrap: balance;
  }
  .lede { color: var(--color-muted); font-size: 14.5px; max-width: 56ch; margin: 0 0 20px; }

  .journey { width: 100%; height: auto; margin: 4px 0 22px; }
  .progress-row { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .progress-track {
    flex: 1; height: 6px; border-radius: 999px; background: var(--color-chip);
    overflow: hidden; border: 1px solid var(--color-border);
  }
  .progress-fill {
    height: 100%; width: 0%; background: linear-gradient(90deg, var(--color-mint), var(--color-mint-soft));
    border-radius: 999px; transition: width 320ms ease;
  }
  @media (prefers-reduced-motion: reduce) { .progress-fill { transition: none; } }
  .progress-label { font-family: var(--font-mono); font-size: 12px; color: var(--color-dim); white-space: nowrap; font-variant-numeric: tabular-nums; }

  .steps { display: flex; flex-direction: column; gap: 10px; margin-top: 28px; }

  .step {
    background: var(--color-panel);
    border: 1px solid var(--color-line);
    border-radius: 12px;
    overflow: hidden;
    transition: opacity 200ms ease, transform 200ms ease;
  }
  .step[data-state="locked"] { opacity: 0.42; pointer-events: none; }
  .step[data-state="active"] { border-color: var(--color-mint); box-shadow: 0 0 0 1px rgba(62,207,142,0.25), 0 12px 32px -16px rgba(62,207,142,0.25); }
  .step[data-state="done"] { border-color: var(--color-border-strong); }

  .step-summary {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 18px; cursor: pointer; user-select: none;
    background: var(--color-panel-head);
  }
  .step[data-state="locked"] .step-summary { cursor: default; }

  .step-num {
    flex: none; width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 13px; font-weight: 600;
    background: var(--color-chip); color: var(--color-dim);
    border: 1px solid var(--color-border);
  }
  .step[data-state="active"] .step-num { background: var(--color-mint); color: var(--color-on-mint); border-color: var(--color-mint); }
  .step[data-state="done"] .step-num { background: transparent; color: var(--color-mint); border-color: var(--color-mint-pale); }
  .step[data-state="done"] .step-num::before { content: "✓"; }

  .step-summary-text { flex: 1; min-width: 0; }
  .step-tag { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-mint-soft); }
  .step-tag.optional { color: var(--color-amber); }
  .step-title { font-weight: 600; font-size: 14.5px; margin-top: 2px; }
  .step-reason { color: var(--color-faint); font-size: 13px; margin-top: 2px; }

  .step-caret { flex: none; color: var(--color-dim); transition: transform 180ms ease; }
  .step[data-open="true"] .step-caret { transform: rotate(90deg); color: var(--color-mint); }
  @media (prefers-reduced-motion: reduce) { .step-caret { transition: none; } }

  .step-body { display: none; padding: 4px 18px 20px; }
  .step[data-open="true"] .step-body { display: block; }

  .mock {
    background: var(--color-surface);
    border: 1px solid var(--color-line);
    border-radius: 10px;
    padding: 14px;
    margin: 12px 0 16px;
  }
  .mock-bar { display: flex; gap: 6px; margin-bottom: 12px; }
  .mock-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--color-border-strong); }

  .action-desc { font-size: 14px; color: var(--color-fg-soft); margin: 0 0 4px; }
  .action-desc strong { color: var(--color-fg); }
  .fine-print { font-size: 12.5px; color: var(--color-dim); margin: 10px 0 0; }

  .btn-next {
    font-family: var(--font-sans); font-weight: 600; font-size: 13.5px;
    background: var(--color-mint); color: var(--color-on-mint);
    border: none; border-radius: 8px; padding: 10px 18px;
    cursor: pointer; margin-top: 14px;
  }
  .btn-next:hover { background: var(--color-mint-soft); }
  .btn-next[disabled] { opacity: 0.5; cursor: default; }

  .optional-note {
    display: inline-block; margin-top: 12px; font-size: 12.5px; color: var(--color-amber);
    background: rgba(227,179,65,0.1); border: 1px solid rgba(227,179,65,0.3);
    border-radius: 6px; padding: 5px 10px;
  }

  .done-banner {
    margin-top: 24px; padding: 20px; border-radius: 12px;
    background: var(--color-panel); border: 1px solid var(--color-mint-pale);
    display: none; align-items: center; gap: 14px;
  }
  .done-banner.show { display: flex; }
  .done-banner .emoji { font-size: 28px; }
  .done-banner h3 { margin: 0 0 4px; font-size: 15px; }
  .done-banner p { margin: 0; color: var(--color-muted); font-size: 13.5px; }

  /* ---- mockup primitives (schematic, not real screenshots) ---- */
  .m-field { border: 1px dashed var(--color-border-strong); border-radius: 8px; padding: 10px 12px; font-size: 12.5px; color: var(--color-dim); font-family: var(--font-mono); }
  .m-row { display: flex; gap: 8px; }
  .m-row > * { flex: 1; }
  .m-btn { background: var(--color-mint); color: var(--color-on-mint); border-radius: 7px; padding: 8px 12px; font-size: 12.5px; font-weight: 600; text-align: center; }
  .m-btn.ghost { background: var(--color-chip); color: var(--color-fg-soft); border: 1px solid var(--color-border); }
  .m-card { border: 1px solid var(--color-line); border-radius: 8px; padding: 10px 12px; background: var(--color-panel); }
  .m-badge { display: inline-block; font-family: var(--font-mono); font-size: 10px; padding: 2px 7px; border-radius: 999px; }
  .m-badge.high { background: rgba(62,207,142,0.15); color: var(--color-mint); }
  .m-badge.conflict { background: rgba(227,179,65,0.15); color: var(--color-amber); }
  .m-badge.secret { background: rgba(229,103,92,0.15); color: var(--color-danger); }
  .m-kv { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 12px; padding: 6px 0; border-bottom: 1px dashed var(--color-line); }
  .m-kv:last-child { border-bottom: none; }
  .m-kv .k { color: var(--color-fg-soft); }
  .m-kv .v { color: var(--color-dim); }
  .m-drop { border: 1.5px dashed var(--color-border-strong); border-radius: 10px; padding: 22px; text-align: center; color: var(--color-dim); font-size: 12.5px; }
  .m-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .m-tab { font-family: var(--font-mono); font-size: 11px; padding: 5px 10px; border-radius: 6px; color: var(--color-dim); background: var(--color-chip); }
  .m-tab.active { color: var(--color-mint); background: rgba(62,207,142,0.12); }
  .m-lock { display: flex; align-items: center; gap: 8px; color: var(--color-dim); font-size: 12.5px; }
</style>

<div class="page">
  <div class="head">
    <div class="eyebrow">키지기 · 시작 가이드</div>
    <h1>몇 단계면 첫 키가 안전하게 들어갑니다</h1>
    <p class="lede">순서대로 눌러보세요. 다음 단계는 앞 단계를 마쳐야 열립니다 — 지금 화면에서
      실제로 뭘 누르게 될지, 왜 누르는지부터 먼저 적어뒀습니다.</p>

      <defs>

          <path d="M0,0 L0,7 L7,3.5 z" fill="#3ecf8e"/>
        </marker>
      </defs>
      <g font-family="ui-monospace, monospace" font-size="10.5">
        <!-- 입구 2개 -->
        <rect x="4" y="8" width="132" height="38" rx="8" fill="#12151a" stroke="#2a313b"/>
        <text x="70" y="26" fill="#c7cdd6" text-anchor="middle">.env 파일 드롭</text>
        <text x="70" y="39" fill="#5c6572" text-anchor="middle" font-size="9.5">변수 전체를 한 번에</text>

        <rect x="4" y="86" width="132" height="38" rx="8" fill="#12151a" stroke="#2a313b"/>

        <!-- 분류 -->
        <rect x="196" y="47" width="128" height="38" rx="8" fill="#101318" stroke="#3ecf8e"/>

        <text x="260" y="78" fill="#5c6572" text-anchor="middle" font-size="9.5">애매하면 단정 안 함</text>

        <!-- 금고 -->
        <rect x="384" y="47" width="128" height="38" rx="8" fill="#101318" stroke="#3ecf8e"/>
        <text x="448" y="65" fill="#a7e8c9" text-anchor="middle">암호화 금고</text>
        <text x="448" y="78" fill="#5c6572" text-anchor="middle" font-size="9.5">AES-256-GCM</text>

        <!-- 출구 2개 -->
        <rect x="572" y="8" width="144" height="38" rx="8" fill="#12151a" stroke="#2a313b"/>
        <text x="644" y="26" fill="#c7cdd6" text-anchor="middle">.env 내보내기</text>
        <text x="644" y="39" fill="#5c6572" text-anchor="middle" font-size="9.5">파일이 필요할 때</text>

        <rect x="572" y="86" width="144" height="38" rx="8" fill="#12151a" stroke="#2a313b"/>
        <text x="644" y="104" fill="#c7cdd6" text-anchor="middle">keylens_env SDK</text>
        <text x="644" y="117" fill="#5c6572" text-anchor="middle" font-size="9.5">파일 없이 코드에서</text>

        <!-- 연결선 -->
        <g stroke="#3ecf8e" stroke-width="1.4" fill="none" marker-end="url(#ar)" opacity=".75">
          <path d="M136 27 C 168 27, 168 60, 194 63"/>
          <path d="M136 105 C 168 105, 168 72, 194 69"/>
          <path d="M324 66 L 382 66"/>
          <path d="M512 63 C 540 63, 540 30, 570 27"/>
          <path d="M512 69 C 540 69, 540 102, 570 105"/>
        </g>
      </g>
    </svg>

    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel">0 / 10 완료</div>
    </div>
  </div>

  <div class="steps" id="steps"></div>

  <div class="done-banner" id="doneBanner">
    <div class="emoji">🔑</div>
    <div>
      <h3>여기까지가 기본 흐름입니다</h3>
      <p>이후엔 스크린샷을 던질 때마다 이 과정이 반복됩니다 — 한 번 익히면 몇 초면 끝나요.</p>
    </div>
  </div>
</div>

<script>
const STEPS = [
  {
    tag: '1단계 · 필수', title: '마스터 비밀번호 만들기',

let current = 0;
const container = document.getElementById('steps');

function render() {
  container.innerHTML = STEPS.map((s, i) => {
    let state = i < current ? 'done' : i === current ? 'active' : 'locked';
    const open = i === current;
    return (
      '<div class="step" data-state="' + state + '" data-open="' + open + '" data-idx="' + i + '">' +
        '<div class="step-summary" role="button" tabindex="' + (state==='locked'?'-1':'0') + '">' +
          '<div class="step-num"></div>' +
          '<div class="step-summary-text">' +
            '<div class="step-tag' + (s.optional ? ' optional' : '') + '">' + s.tag + '</div>' +
            '<div class="step-title">' + (i+1) + '. ' + s.title + '</div>' +
            '<div class="step-reason">' + s.reason + '</div>' +
          '</div>' +
          '<div class="step-caret">&#9656;</div>' +
        '</div>' +
        '<div class="step-body">' +
          '<p class="action-desc">' + s.body.desc + '</p>' +
          s.body.mock +
          (s.optional ? '<div class="optional-note">💡 ' + s.optional + '</div>' : '') +
          (s.body.fine ? '<p class="fine-print">' + s.body.fine + '</p>' : '') +
          '<button class="btn-next" data-advance="' + i + '">' + s.body.next + '</button>' +
        '</div>' +
      '</div>'
    );
  }).join('');
  updateProgress();
}

function updateProgress() {
  document.getElementById('progressFill').style.width = (current / STEPS.length * 100) + '%';
  document.getElementById('progressLabel').textContent = current + ' / ' + STEPS.length + ' 완료';
  document.getElementById('doneBanner').classList.toggle('show', current >= STEPS.length);
}

container.addEventListener('click', (e) => {
  const advanceBtn = e.target.closest('[data-advance]');
  if (advanceBtn) {
    const idx = parseInt(advanceBtn.dataset.advance, 10);
    if (idx === current) {
      current = Math.min(current + 1, STEPS.length);
      render();
      const next = container.querySelector('.step[data-state="active"]');
      if (next) next.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    return;
  }
  const summary = e.target.closest('.step-summary');
  if (summary) {
    const step = summary.closest('.step');
    const idx = parseInt(step.dataset.idx, 10);
    if (step.dataset.state === 'locked') return;
    if (idx === current) return; // already open/active
    if (idx < current) {
      // reopen a completed step for review, without losing progress
      document.querySelectorAll('.step').forEach(el => {
        if (parseInt(el.dataset.idx,10) === idx) el.dataset.open = el.dataset.open === 'true' ? 'false' : 'true';
      });
    }
  }
});

render();
</script>
