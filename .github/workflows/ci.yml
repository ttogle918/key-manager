# CI — 대회 2차 검증(테스트·라이선스·재현성·취약점)을 push/PR 마다 자동 실행.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-test:
    name: 백엔드 테스트 (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 의존성 설치(런타임+테스트)
        run: pip install -r backend/requirements-dev.txt
      - name: OCR 모델 벤더링(RapidOCR 한국어 인식, CORE-3)
        working-directory: backend
        run: python scripts/vendor_ocr_models.py
      - name: pytest
        working-directory: backend
        run: python -m pytest -q

  manager-relay-test:
    name: 매니저 릴레이 테스트 (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 의존성 설치(런타임+테스트)
        run: pip install -r manager-relay/requirements-dev.txt
      - name: pytest
        working-directory: manager-relay
        env:
          SMTP_HOST: smtp.test.invalid
          SMTP_PORT: "587"
          SMTP_USER: relay@test.invalid
          SMTP_PASS: test-password
          PUBLIC_BASE_URL: http://localhost:8080
        run: python -m pytest -q

  frontend:
    name: 프론트 빌드·테스트·린트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: 린트(oxlint)
        working-directory: frontend
        run: npm run lint
      - name: 유닛 테스트(vitest)
        working-directory: frontend
        run: npm run test
      - name: 프로덕션 빌드(tsc + vite, tesseract 벤더링 포함)
        working-directory: frontend
        run: npm run build

  license:
    name: 라이선스 (reuse + 카피레프트 0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # SPDX 헤더 누락 0 (REUSE 3.3). reuse 의 전이 의존성은 검사 대상이 아니라 별도 스텝에서 실행.
      - name: reuse lint
        run: |
          pip install "reuse==6.2.0"
          reuse lint

      # 백엔드+manager-relay 런타임 의존성을 함께 깐 clean 환경에서 카피레프트 검사(도구
      # 의존성 오탐 회피). manager-relay/ 도 이 브랜치에서 추가된 별도 배포형 서비스라
      # 같은 게이트를 통과해야 한다. 강한 카피레프트(GPL/AGPL)는 예외 없이 차단. 약한
      # 카피레프트(LGPL/MPL)는 THIRD-PARTY-NOTICES.md에 근거(미수정 사용·재링크 가능 구조)를
      # 남긴 승인 목록만 통과시킨다.
      - name: 백엔드+manager-relay 라이선스 (pip-licenses, 카피레프트 검사)
        run: |
          python -m venv /tmp/rt
          /tmp/rt/bin/pip install -q -r backend/requirements.txt -r manager-relay/requirements.txt pip-licenses
          /tmp/rt/bin/pip-licenses --format=csv > licenses-backend.csv
          echo "--- 백엔드+manager-relay 런타임 라이선스 ---"; cat licenses-backend.csv

          if grep -iE '"[^"]*","[^"]*","[^"]*(A?GPL|GNU (Affero|General) Public)[^"]*"' licenses-backend.csv \
              | grep -viE 'LGPL|Lesser'; then
            echo "::error::백엔드 런타임에 강한 카피레프트(GPL/AGPL) 의존성이 있습니다"; exit 1
          fi

          # 새 의존성이 LGPL/MPL로 걸리면: 미수정 사용인지·재링크 가능 구조인지 확인해
          # THIRD-PARTY-NOTICES.md에 근거를 남긴 뒤에만 여기 추가한다(자동 통과 금지).
          ALLOWED_WEAK_COPYLEFT="tqdm"
          tail -n +2 licenses-backend.csv | while IFS=',' read -r name _ license; do
            name=$(echo "$name" | tr -d '"')
            license=$(echo "$license" | tr -d '"')
            if echo "$license" | grep -qiE 'LGPL|Lesser|Mozilla Public|MPL'; then
              if ! echo " $ALLOWED_WEAK_COPYLEFT " | grep -qi " $name "; then
                echo "::error::승인되지 않은 약한 카피레프트 의존성: $name ($license) — THIRD-PARTY-NOTICES.md 근거 기록 후 허용목록에 추가하세요"
                exit 1
              fi
            fi
          done

      # 프론트 production(배포) 트리만 검사 — devDependencies(빌드 CSS 도구의 MPL 등)는 제외.
      - name: 프론트 라이선스 (license-checker --production, 카피레프트 0)
        working-directory: frontend
        run: |
          npm ci
          npx --yes license-checker --production --summary | tee licenses-frontend.txt
          if grep -iE '(A?L?GPL|MPL)' licenses-frontend.txt; then
            echo "::error::프론트 production 트리에 카피레프트 의존성이 있습니다"; exit 1
          fi

  security:
    name: 취약점 (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 백엔드 취약점 (pip-audit)
        env:
          PYTHONUTF8: "1"  # requirements.txt 의 한글 주석을 UTF-8로 확실히 파싱
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
      - name: 프론트 취약점 (npm audit, production)
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
