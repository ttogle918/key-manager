#
# Notion. API 토큰은 접두사(secret_ / ntn_)로 값 기반 식별 가능하지만,
# database/data_source/page ID는 전부 동일한 32자리 UUID라 값만으로는 구분 불가 → Stage2(라벨·URL).
service: notion
display_name: Notion
console_url: "https://www.notion.so/my-integrations"
prereq: "워크스페이스 소유자 권한 필요 — Internal Integration 생성 후 대상 페이지·DB를 통합에 공유"
steps:
  - "notion.so/my-integrations 접속 → + New integration"
  - "이름·워크스페이스 선택, 타입 Internal 로 생성"
  - "Internal Integration Secret → Show → Copy"
credentials:
  - kind: api_key
    label: "API Key"
    label_patterns:
      - "Internal Integration Token"
      - "Internal Integration Secret"
      - "Integration Token"
      - "API key"
      - "Secret"
    url_patterns: []
    value_regex: "^(secret_|ntn_)[A-Za-z0-9]{36,}$"
    official_env_name: NOTION_API_KEY
    exposure: secret
    impact: "유출 시 연결된 페이지·DB를 무단 열람·수정 가능"
    role: "Notion API 인증용 비밀 토큰. 서버 전용 — 절대 노출·커밋 금지"
    docs_url: "https://developers.notion.com/docs/create-a-notion-integration"
    expiry_known: false
    # 유효성 검증(TRUST-1): 봇 사용자 정보 조회는 read-only. 유효=200, 폐기/오타=401.
    verify:
      method: GET
      url: "https://api.notion.com/v1/users/me"
      auth: bearer
      extra_headers:
        Notion-Version: "2022-06-28"

  - kind: database_id
    label: "Database ID"
    label_patterns:
      - "Database ID"
      - "데이터베이스 ID"
    url_patterns:
      - "notion\\.so/[^/?]+/([0-9a-fA-F]{32})\\?v="
    value_regex: null
    official_env_name: NOTION_DATABASE_ID
    exposure: public
    role: "DB를 가리키는 36자 식별자. 공유 링크 URL의 ?v= 앞에서 추출 — 비밀 아님"
    docs_url: "https://developers.notion.com/docs/working-with-databases"
    expiry_known: false

  - kind: data_source_id
    label: "Data Source ID"
    label_patterns:
      - "Data source"
      - "Data sources"
      - "데이터 소스"
    url_patterns: []
    value_regex: null
    official_env_name: NOTION_DATA_SOURCE_ID
    exposure: public
    role: "DB 내 개별 데이터 소스 ID. Retrieve a database 응답·'Manage data sources'에서 확인 — 비밀 아님"
    docs_url: "https://developers.notion.com/docs/working-with-databases"
    expiry_known: false

  - kind: page_id
    label: "Page ID"
    label_patterns:
      - "Page ID"
      - "페이지 ID"
    url_patterns:
      - "notion\\.so/(?:[^/?]+/)?(?:[^/?]*-)?([0-9a-fA-F]{32})(?:$|\\?p=|#)"
    value_regex: null
    official_env_name: NOTION_PAGE_ID
    exposure: public
    role: "특정 페이지를 가리키는 UUID. 페이지 URL 끝에서 추출 — 비밀 아님"
    docs_url: "https://developers.notion.com/reference/retrieve-a-page"
    expiry_known: false
