# GitHub. 2021년 포맷 개편으로 토큰이 접두어(ghp_ 등)로 식별 가능해졌다(값 기반).
# 포맷 출처: GitHub 공식 문서/변경로그(접두어 + 36자 base62, fine-grained 는 github_pat_).
service: github
display_name: GitHub
console_url: "https://github.com/settings/tokens"
prereq: "없음 (GitHub 계정 로그인만)"
steps:
  - "Settings → Developer settings"
  - "Personal access tokens (Fine-grained 또는 Tokens classic)"
  - "Generate new token → 권한·스코프 지정 후 생성"
credentials:
  - kind: personal_access_token
    label: "Personal Access Token"
    label_patterns:
      - "Personal access token"
      - "Personal access tokens"
      - "Token (classic)"
    url_patterns:
      - "github\\.com/settings/tokens"
    # 클래식 PAT(ghp_+36) 또는 fine-grained(github_pat_+가변). 둘 다 값만으로 식별 가능.
    value_regex: "^(ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{40,})$"
    official_env_name: GITHUB_TOKEN
    exposure: secret
    impact: "유출 시 레포·계정 권한 범위의 코드·설정 접근"
    security_tip: "fine-grained·최소 스코프·만료일 설정 권장"
    role: "GitHub API·git 인증용 개인 토큰. 서버·CI에 안전 보관(classic ghp_ / fine-grained github_pat_)"
    docs_url: "https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens"
    expiry_known: false
    # 유효성 검증(TRUST-1): 현재 사용자 조회는 read-only. GitHub API 는 User-Agent 필수.
    verify:
      method: GET
      url: "https://api.github.com/user"
      auth: bearer
      extra_headers:
        User-Agent: "KeyLens"
