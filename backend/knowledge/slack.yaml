# Slack. 토큰은 접두어로 종류가 갈린다: xoxb-(봇), xoxp-(유저). 값 기반 식별 가능.
# 포맷 출처: Slack 공식 문서(Tokens). 검증은 auth.test 가 200+본문 ok 필드라 HTTP 상태만으론
# 판단 불가 → verify 미선언(unsupported).
service: slack
display_name: Slack
console_url: "https://api.slack.com/apps"
prereq: "Slack 앱 먼저 생성 (api.slack.com/apps)"
steps:
  - "api.slack.com/apps 에서 앱 선택·생성"
  - "OAuth & Permissions에서 Bot·User 스코프 추가"
  - "Install to Workspace로 설치 → 토큰 발급"
credentials:
  - kind: bot_token
    label: "Bot Token"
    label_patterns:
      - "Bot User OAuth Token"
      - "Bot token"
    url_patterns: []
    value_regex: "^xoxb-[0-9A-Za-z-]{10,}$"
    official_env_name: SLACK_BOT_TOKEN
    role: "앱(봇) 신원으로 API 호출하는 토큰. 서버 전용 비밀(xoxb-)"
    docs_url: "https://api.slack.com/authentication/token-types"
    expiry_known: false

  - kind: user_token
    label: "User Token"
    label_patterns:
      - "User OAuth Token"
      - "User token"
    url_patterns: []
    value_regex: "^xoxp-[0-9A-Za-z-]{10,}$"
    official_env_name: SLACK_USER_TOKEN
    role: "사용자 본인 권한으로 행동하는 토큰. 서버 전용 비밀(xoxp-)"
    docs_url: "https://api.slack.com/authentication/token-types"
    expiry_known: false
