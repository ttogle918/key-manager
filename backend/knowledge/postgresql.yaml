#
# PostgreSQL 연결 문자열(libpq Connection URI).
#
# 여기서 다루는 건 "우리가 쓰는 DB"가 아니라 **사용자의 .env 에 들어 있는 연결 문자열**이다.
# KeyLens 자체 저장소는 SQLite(backend/vault.db) 그대로다.
#
# 왜 자격증명인가: postgres://user:password@host/db 는 URL 안에 **비밀번호가 평문으로**
# 들어 있다. 유출되면 DB 전체를 읽고 쓸 수 있으므로 API 키와 같은 급으로 다뤄야 한다.
#
# 값만으로 식별 가능(Stage1): 스킴이 postgres:// 또는 postgresql:// 로 고정이고
# user:password@host 구조가 뚜렷하다. 포맷 근거는 공식 문서(libpq Connection URIs)를
# 직접 읽고 작성했다 — 외부 탐지 도구의 패턴을 가져오지 않았다.
service: postgresql
display_name: PostgreSQL
console_url: null
prereq: "없음 (DB 를 직접 운영하거나 관리형 서비스에서 발급받은 연결 문자열)"
steps:
  - "관리형 DB(Supabase·Neon·RDS 등)는 대시보드의 Connection string / 연결 정보에서 복사"
  - "직접 운영 중이면 postgres://<사용자>:<비밀번호>@<호스트>:5432/<DB이름> 형태로 조합"
  - "비밀번호가 들어간 문자열이므로 저장소에 커밋하지 말 것"
credentials:
  - kind: connection_url
    label: "Connection String"
    label_patterns:
      - "Connection string"
      - "Connection URI"
      - "Database URL"
      - "Connection pooling"
      - "연결 문자열"
      - "연결 정보"
      - "데이터베이스 URL"
    url_patterns: []
    # user:password@host 가 모두 있을 때만 자격증명으로 본다.
    # postgres://localhost/mydb 처럼 비밀번호가 없는 건 시크릿이 아니라 설정이라
    # 일부러 매칭하지 않는다(그런 줄은 "미지정"으로 남는다).
    value_regex: "^postgres(?:ql)?://[^:@/\\s]+:[^@/\\s]+@\\S+$"
    official_env_name: DATABASE_URL
    expiry_known: false
    exposure: secret
    impact: "유출 시 DB 전체 읽기·쓰기 가능 — 데이터 유출과 파괴 모두 가능"
    role: "애플리케이션이 DB 에 붙을 때 쓰는 연결 문자열. 비밀번호가 안에 들어 있어 서버 전용"
    security_tip: "가능하면 읽기 전용 계정을 따로 만들고, DB 방화벽에서 접속 IP 를 제한할 것"
    docs_url: "https://www.postgresql.org/docs/current/libpq-connect.html#LIBPQ-CONNSTRING"
